name: Fiyat kontrol

# Cloudflare Worker tetikler (yeni takip eklenince ve 30 dakikada bir).
on:
  workflow_dispatch:

# Aynı anda tek kontrol çalışsın; arkadan gelen bir tanesi sırada beklesin.
concurrency:
  group: fiyat-kontrol
  cancel-in-progress: false

jobs:
  check:
    # Linux sunucuda Akamai 403 verdi; Windows'ta gerçek Chrome + masaüstü ile deniyoruz
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r checker/requirements.txt

      - name: Fiyatları kontrol et
        working-directory: checker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
          PYTHONIOENCODING: utf-8
        run: python check.py
